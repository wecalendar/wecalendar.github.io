<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your Global Admin guide — WeTransact</title>
<style>
@font-face{font-family:'Greycliff CF';src:url(GreycliffCF-Medium.ttf) format('truetype');font-weight:500}
@font-face{font-family:'Greycliff CF';src:url(GreycliffCF-Bold.ttf) format('truetype');font-weight:700}
*{box-sizing:border-box}
body{margin:0;font-family:'Greycliff CF',-apple-system,'Segoe UI',sans-serif;font-weight:500;color:#343130;background:#F5F3FF;min-height:100vh}
.band{background:#021774;height:96px;position:relative;overflow:hidden}
.band svg{position:absolute;inset:0;width:100%;height:100%}
.band img{position:relative;height:26px;margin:35px 0 0 32px}
.wrap{max-width:560px;margin:48px auto;padding:0 24px}
.card{background:#fff;border:1px solid #E2DBFF;border-radius:16px;padding:32px}
h1{margin:0 0 6px;font-size:24px;font-weight:700;color:#2C1C6C;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:#656578;font-size:14px;line-height:1.55}
.portal{margin:0 0 22px;padding:12px 16px;background:#FBF9FF;border:1px solid #E2DBFF;border-radius:10px;font-size:13px;word-break:break-all}
.portal a{color:#5E43C8;font-weight:700}
.btn{display:inline-block;background:#5E43C8;color:#fff;font-weight:700;font-size:15px;font-family:inherit;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;text-decoration:none}
.btn[disabled]{opacity:.55;cursor:default}
.msg{margin-top:14px;font-size:13px;color:#656578;min-height:18px}
.msg.err{color:#B3261E}
.msg a{color:#5E43C8}
.foot{margin-top:26px;font-size:12px;color:#9191A4}
</style>
</head>
<body>
<div class="band">
  <svg viewBox="0 0 794 96" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="794" height="96" fill="#021774"/><circle cx="600" cy="96" r="118" fill="#8266F4"/><circle cx="600" cy="96" r="53" fill="#FFE163"/></svg>
  <img src="wt-logo-white.png" alt="WeTransact" onerror="this.style.display='none'">
</div>
<div class="wrap"><div class="card">
  <h1 id="hd">Your Global Admin guide</h1>
  <p class="sub" id="sub">This one-pager explains the Partner Center setup your Global Admin owns — personalised with your company's WeTransact portal link, ready to forward.</p>
  <div class="portal" id="portalBox" style="display:none">Your WeTransact portal: <a id="portalA" target="_blank" rel="noopener"></a></div>
  <button class="btn" id="dl" disabled>Preparing your PDF…</button>
  <div class="msg" id="msg"></div>
  <div class="foot">Questions? Reply to the email this came from and your CSM will pick it up.</div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var portal = (q.get("p") || "").trim();
  var company = (q.get("c") || "").trim().slice(0, 80);
  var PDF_URL = "Forward-to-Global-Admin.pdf";
  var dl = document.getElementById("dl"), msg = document.getElementById("msg");

  // only a plain http(s) URL may be stamped or linked
  if (!/^https?:\/\/[^\s]+$/i.test(portal)) portal = "";

  if (!portal){ location.replace(PDF_URL); return; }

  if (company) document.getElementById("hd").textContent = "Global Admin guide — " + company;
  var pa = document.getElementById("portalA"); pa.href = portal; pa.textContent = portal.replace(/^https?:\/\//, "");
  document.getElementById("portalBox").style.display = "";

  var safe = (company || "WeTransact").replace(/[^A-Za-z0-9 _-]/g, "").trim().replace(/\s+/g, "-").slice(0, 40) || "WeTransact";
  var FILE = "Forward-to-Global-Admin-" + safe + ".pdf";

  function fetchBuf(u){ return fetch(u).then(function(r){ if (!r.ok) throw new Error("download failed (" + r.status + ")"); return r.arrayBuffer(); }); }

  var built = null;
  function build(){
    if (built) return built;
    built = Promise.all([fetchBuf(PDF_URL), fetchBuf("GreycliffCF-Light.ttf"), fetchBuf("GreycliffCF-Bold.ttf")]).then(function(a){
      var PL = window.PDFLib;
      return PL.PDFDocument.load(a[0]).then(function(doc){
        doc.registerFontkit(window.fontkit);
        return Promise.all([doc.embedFont(a[1], { subset: true }), doc.embedFont(a[2], { subset: true })]).then(function(f){
          var light = f[0], bold = f[1], p = doc.getPage(0);
          var body = PL.rgb(0.204, 0.192, 0.188), purple = PL.rgb(0.369, 0.263, 0.784);
          /* cover the "1. Go to {Portal link} and log in…" line with the card bg */
          p.drawRectangle({ x: 62, y: 389.5, width: 484, height: 16, color: PL.rgb(242/255, 238/255, 1) });
          var X = 68.5, BASE = 393.6, MAXW = 475;
          var s1 = "1. Go to ", s2 = "your WeTransact portal »",
              s3 = " and log in with Microsoft SSO by clicking the Microsoft icon.";
          var size = 9.8;
          function tw(){ return light.widthOfTextAtSize(s1, size) + bold.widthOfTextAtSize(s2, size) + light.widthOfTextAtSize(s3, size); }
          while (tw() > MAXW && size > 7.5) size -= 0.1;
          var w1 = light.widthOfTextAtSize(s1, size), w2 = bold.widthOfTextAtSize(s2, size);
          p.drawText(s1, { x: X, y: BASE, size: size, font: light, color: body });
          p.drawText(s2, { x: X + w1, y: BASE, size: size, font: bold, color: purple });
          p.drawText(s3, { x: X + w1 + w2, y: BASE, size: size, font: light, color: body });
          p.drawRectangle({ x: X + w1, y: BASE - 1.6, width: w2, height: 0.7, color: purple });
          var ann = doc.context.register(doc.context.obj({
            Type: "Annot", Subtype: "Link", Rect: [X + w1, BASE - 3, X + w1 + w2, BASE + size + 1], Border: [0, 0, 0],
            A: { Type: "Action", S: "URI", URI: PL.PDFString.of(portal) }
          }));
          var annots = p.node.lookup(PL.PDFName.of("Annots"), PL.PDFArray);
          if (!annots){ annots = doc.context.obj([]); p.node.set(PL.PDFName.of("Annots"), annots); }
          annots.push(ann);
          return doc.save();
        });
      });
    });
    return built;
  }

  function download(){
    dl.disabled = true; dl.textContent = "Preparing your PDF…"; msg.className = "msg"; msg.textContent = "";
    build().then(function(bytes){
      var blob = new Blob([bytes], { type: "application/pdf" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = FILE;
      document.body.appendChild(a); a.click(); a.remove();
      dl.disabled = false; dl.textContent = "Download the guide again";
      msg.textContent = "✓ " + FILE + " downloaded — forward it to your Global Admin.";
    }).catch(function(e){
      built = null; dl.disabled = false; dl.textContent = "Try again";
      msg.className = "msg err";
      msg.innerHTML = "Couldn't personalise the PDF (" + String((e && e.message) || e).replace(/[<>&]/g, "") + ") — <a href=\"" + PDF_URL + "\">download the standard guide</a> instead.";
    });
  }

  dl.addEventListener("click", download);
  download();
})();
</script>
</body>
</html>
