<style>
  :root{ --accent:#5E43C8; --accent-d:#402C93; --ink:#021774; --muted:#4E5D9E; --line:#E1E4FF; --green:#098768; --green-d:#05614B; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#F3F5FF; color:var(--ink); font-size:14px; min-height:100vh; display:flex; justify-content:center; padding:28px 16px; }
  .card{ width:100%; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 8px 40px rgba(44,28,108,.08); overflow:hidden; }
  .hd{ padding:26px 28px 18px; border-bottom:1px solid var(--line); text-align:center; }
  .wtmark{ height:58px; display:block; margin:0 auto 6px; }
  .tzrow{ justify-content:center; }
  .wordmark{ font-size:15px; font-weight:600; letter-spacing:.01em; }
  .wordmark .a1{ color:var(--accent); } .wordmark .a2{ color:var(--ink); }
  h1{ font-size:21px; font-weight:600; margin:12px 0 4px; line-height:1.25; }
  .sub{ font-size:13px; color:var(--muted); }
  .tzrow{ display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12.5px; color:var(--muted); }
  .tzwrap{ position:relative; display:inline-block; }
  .tzwrap input{ font-family:inherit; font-size:12.5px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; color:var(--ink); background:#fff; width:200px; max-width:52vw; outline:none; }
  .tzwrap input:focus{ border-color:var(--accent); }
  .tzres{ position:absolute; z-index:30; top:calc(100% + 4px); left:0; width:262px; max-width:78vw; max-height:240px; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 28px rgba(0,0,0,.12); padding:4px; text-align:left; }
  .tzres.hide{ display:none; }
  .tzres div{ display:flex; gap:8px; align-items:center; padding:6px 8px; border-radius:7px; cursor:pointer; font-size:12.5px; color:var(--ink); }
  .tzres div:hover{ background:#EBE7FF; }
  .tzres .off{ margin-left:auto; color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .body{ padding:18px 28px 26px; }
  .day{ font-size:13px; font-weight:700; color:var(--ink); margin:18px 0 8px; }
  .day:first-child{ margin-top:4px; }
  .slots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  .slot{ border:1.5px solid var(--green); color:var(--green-d); background:#fff; border-radius:10px; padding:10px 8px; font-size:13.5px; font-weight:600; cursor:pointer; text-align:center; transition:.12s; font-family:inherit; }
  .slot:hover{ background:var(--green); color:#fff; }
  .empty,.msg{ text-align:center; color:var(--muted); padding:36px 10px; font-size:14px; line-height:1.6; }
  .spin{ display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .foot{ padding:0 28px 22px; font-size:11.5px; color:#7A7D9C; text-align:center; }
  /* modal */
  .ov{ position:fixed; inset:0; background:rgba(44,28,108,.45); display:none; align-items:center; justify-content:center; padding:18px; z-index:30; }
  .ov.on{ display:flex; }
  .modal{ width:100%; max-width:400px; background:#fff; border-radius:16px; padding:24px; }
  .modal h2{ font-size:17px; font-weight:600; margin-bottom:4px; }
  .modal .when{ font-size:13px; color:var(--accent-d); font-weight:600; margin-bottom:16px; }
  .modal label{ display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  .modal input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--ink); outline:none; }
  .modal input:focus{ border-color:var(--accent); }
  .btn{ width:100%; margin-top:18px; border:none; border-radius:999px; padding:12px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; background:var(--green); color:#fff; }
  .btn:hover{ background:var(--green-d); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn.sec{ background:none; color:var(--muted); margin-top:8px; font-weight:500; }
  .err{ color:#b91c1c; font-size:12.5px; margin-top:10px; min-height:16px; }
  .ok-ico{ width:54px; height:54px; border-radius:50%; background:#E2F9F4; color:var(--green-d); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:26px; }
  .joinbtn{ display:inline-block; margin-top:14px; background:var(--accent); color:#fff; text-decoration:none; border-radius:999px; padding:10px 22px; font-weight:600; font-size:14px; }

  /* beauty pass 2026-07-19 — matches web app polish */
  .card{ box-shadow:0 2px 6px rgba(44,28,108,.05), 0 16px 48px rgba(44,28,108,.10); }
  .slot{ transition:background .15s ease, color .15s ease, transform .12s ease, box-shadow .15s ease; }
  .slot:hover{ transform:translateY(-1px); box-shadow:0 4px 14px rgba(18,183,106,.30); }
  .btn, .joinbtn{ transition:background .15s ease, box-shadow .15s ease, transform .12s ease; }
  .btn{ box-shadow:0 2px 10px rgba(18,183,106,.25); }
  .btn:hover{ box-shadow:0 4px 16px rgba(18,183,106,.32); }
  .btn:active{ transform:scale(.98); }
  .btn.sec, .btn.sec:hover{ box-shadow:none; }
  .joinbtn:hover{ background:var(--accent-d); box-shadow:0 4px 14px rgba(94,67,200,.32); }
  @keyframes popin{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  .modal{ animation:popin .18s ease; box-shadow:0 20px 60px rgba(20,16,40,.30); }
  .modal input{ transition:border-color .15s ease, box-shadow .15s ease; }
  .modal input:focus{ border-color:#C5BDFB; box-shadow:0 0 0 3px rgba(94,67,200,.10); }

  /* ==== WeTransact rebrand (2026-10-31) ==== */
  :root{ --accent:#5E43C8; --accent-d:#402C93; --ink:#021774; --muted:#4E5D9E; --line:#E1E4FF; --green:#098768; --green-d:#05614B; }
  body{ font-family:var(--wt-font-body); background:linear-gradient(180deg,#EBE7FF 0,#F3F5FF 420px) fixed, #F3F5FF; -webkit-font-smoothing:antialiased; }

  .card{ border-radius:30px; border-color:var(--line); box-shadow:0 18px 40px rgba(31,23,89,.08); }
  .hd{ background:url('brand/grid-on-dark.svg') center/cover no-repeat, linear-gradient(180deg,#021774 0%,#402C93 70%,#5E43C8 100%); background-blend-mode:hard-light,normal; border-bottom:none; padding:30px 28px 24px; color:#fff; }
  .wtlogo{ display:block; height:24px; width:auto; margin:0 auto 4px; }
  h1{ font-family:var(--wt-font-display); font-size:28px; font-weight:500; letter-spacing:-.03em; line-height:1.15; color:#fff; margin:18px 0 6px; }
  .sub{ color:#FDEBF7; font-size:14px; }
  .tzrow{ color:#C5BDFB; white-space:nowrap; }
  .tzwrap input{ border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.10); color:#fff; border-radius:10px; padding:6px 10px; }
  .tzwrap input::placeholder{ color:#C5BDFB; }
  .tzwrap input:focus{ border-color:#fff; background:rgba(255,255,255,.16); }
  .tzres{ border-color:var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(32,36,138,.14); }
  .tzres div:hover{ background:#EBE7FF; }
  .body{ padding:22px 28px 28px; }
  .day{ font-family:var(--wt-font-display); font-size:15px; font-weight:600; letter-spacing:-.01em; margin:22px 0 10px; }
  .slot{ border:1px solid #8CE8D1; background:#E2F9F4; color:#05614B; border-radius:12px; padding:11px 8px; font-size:14px; }
  .slot:hover{ background:#098768; border-color:#098768; color:#fff; box-shadow:0 8px 18px -6px rgba(9,135,104,.5); }
  .foot{ color:#7A7D9C; font-size:12px; }
  .ov{ background:rgba(1,13,64,.55); }
  .modal{ border-radius:20px; box-shadow:0 32px 64px rgba(11,10,51,.25); }
  .modal h2{ font-family:var(--wt-font-display); font-size:20px; letter-spacing:-.02em; color:var(--ink); }
  .modal .when{ color:#5E43C8; }
  .modal input{ border-color:#D9DDE8; border-radius:12px; }
  .modal input:focus{ border-color:#8266F4; box-shadow:0 0 0 3px rgba(130,102,244,.16); }
  .btn{ border-radius:12px; background:linear-gradient(105deg,#5E43C8,#7A5AEA); box-shadow:0 2px 8px rgba(94,67,200,.22); }
  .btn:hover{ background:linear-gradient(105deg,#513AAD,#6B4AD8); box-shadow:0 10px 24px -4px rgba(94,67,200,.34); }
  .btn.sec{ background:none; color:var(--muted); }
  .ok-ico{ background:#E2F9F4; color:#098768; }
  .joinbtn{ border-radius:12px; background:linear-gradient(105deg,#5E43C8,#7A5AEA); }
  .err{ color:#C0254F; }
  /* Octavia moments (2026-10-31) */
  .msg{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:28px 10px 34px; }
  .msg .oct{ width:200px; height:auto; }
  .msgt{ color:var(--ink); font-size:15px; line-height:1.55; }
  .msgt b{ font-family:var(--wt-font-display); font-weight:500; font-size:24px; letter-spacing:-.03em; display:inline-block; margin-bottom:4px; }
  .msgt .ms{ color:var(--muted); font-size:14px; }
  .ok-hero{ margin:-24px -24px 14px; height:190px; border-radius:20px 20px 0 0; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;
    background:url('brand/grid-on-dark.svg') center/cover no-repeat, linear-gradient(180deg,#021774 0%,#402C93 55%,#8266F4 100%); background-blend-mode:hard-light,normal; }
  .ok-hero img{ width:190px; height:auto; margin-bottom:-22px; filter:drop-shadow(0 14px 24px rgba(1,13,64,.35)); }
  .modal h2{ font-size:24px; font-weight:500; letter-spacing:-.03em; }

let sb = null, LINK = null, SLOTS = [], GONE = new Set(), TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;


function fail(msg, pose){
  // pose: an Octavia illustration for the state (brand/octavia-<pose>.webp); errors default to "confused"
  const img = pose === false ? '' : '<img class="oct" src="brand/octavia-' + (pose || 'confused') + '.webp" alt="" width="200">';
  $("list").innerHTML = '<div class="msg">' + img + '<div class="msgt">' + msg + '</div></div>';
}

// Visitors arrive from anywhere, so the picker is a search box over every city in
// WECAL_TZ (plus every IANA zone) rather than a shortlist — typing "Tel Aviv" works
// even though the zone is called Asia/Jerusalem.
function buildTzSel(){
  const inp = $("tzIn"), box = $("tzRes");
  if (!inp) return;
  const label = v => WECAL_TZ.label(v) + " \u00b7 " + WECAL_TZ.offLabel(v);
  function show(term){
    const res = WECAL_TZ.search(term, 12);
    box.innerHTML = "";
    if (!res.length){ box.classList.add("hide"); return; }
    res.forEach(z => {
      const row = document.createElement("div");
      const nm = document.createElement("span");
      nm.textContent = z.region ? z.city + " \u00b7 " + z.region : z.city;
      const of = document.createElement("span"); of.className = "off"; of.textContent = WECAL_TZ.offLabel(z.zone);
      if (z.zone === TZ) row.style.background = "#EBE7FF";
      row.appendChild(nm); row.appendChild(of);
      row.onmousedown = e => { e.preventDefault(); TZ = z.zone; inp.value = label(TZ); box.classList.add("hide"); render(); };
      box.appendChild(row);
    });
    box.classList.remove("hide");
  }
  inp.value = label(TZ);
  inp.onfocus = () => { inp.select(); show(""); };
  inp.oninput = () => show(inp.value);
  inp.onblur  = () => setTimeout(() => { box.classList.add("hide"); inp.value = label(TZ); }, 160);
}

function dayKey(d){ return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d); }
function dayLabel(d){ return new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long",month:"long",day:"numeric"}).format(d); }
function timeLabel(d){ return new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).format(d); }

function render(){
  const open = SLOTS.filter(s => s.status === "open" && !GONE.has(s.id) && new Date(s.start_utc) > new Date())
                    .sort((a,b)=> new Date(a.start_utc) - new Date(b.start_utc));
  if (!open.length){
    // These are three completely different situations and they used to share one celebratory
    // message, so a visitor whose times had just been withdrawn was told "All booked! Thank
    // you." — which reads as a receipt for a booking they never made. The real confirmation
    // is confirmView() in the overlay; this is only the list's empty state.
    const now = new Date();
    const withdrawn = SLOTS.some(s => s.status === "open" && GONE.has(s.id) && new Date(s.start_utc) > now);
    const anyBooked = SLOTS.some(s => s.status === "booked");
    const allPast = SLOTS.length > 0 && SLOTS.every(s => new Date(s.start_utc) <= now);
    if (withdrawn) fail("<b>These times are gone.</b><br><span class='ms'>Nothing was booked \u2014 ask your host for a few new times.</span>");
    else if (anyBooked) fail("<b>All booked.</b><br><span class='ms'>Every time on this link has been taken.</span>", "headset");
    else if (allPast) fail("<b>These times have passed.</b><br><span class='ms'>Ask your host for a few new ones.</span>");
    else fail("<b>No times are open right now.</b><br><span class='ms'>Check back soon or ask your host for new times.</span>", "headset");
    return;
  }
  const byDay = {};
  open.forEach(s => { const k = dayKey(new Date(s.start_utc)); (byDay[k] = byDay[k] || []).push(s); });
  let html = "";
  Object.keys(byDay).sort().forEach(k => {
    html += '<div class="day">' + dayLabel(new Date(byDay[k][0].start_utc)) + '</div><div class="slots">';
    byDay[k].forEach(s => {
      html += '<button class="slot" data-id="'+s.id+'">'+timeLabel(new Date(s.start_utc))+'</button>';
    });
    html += '</div>';
  });
  $("list").innerHTML = html;
  document.querySelectorAll(".slot").forEach(b => b.onclick = () => openModal(b.dataset.id));
}

// Live availability: ask the host's real calendar which offered times are still free,
// so a time taken on another link (or by any meeting) disappears here too. Best-effort:
// if the check-availability function isn't deployed or errors, we just keep showing open slots.
async function recheck(){
  if (!FN || !slug || !SLOTS.length) return;
  try {
    const r = await fetch(FN + "/check-availability", {
      method: "POST",
      headers: { "Content-Type":"application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY },
      body: JSON.stringify({ slug }),
    });
    const j = await r.json().catch(() => ({}));
    if (j && Array.isArray(j.freeIds)){
      const free = new Set(j.freeIds);
      GONE = new Set(SLOTS.filter(s => s.status === "open" && !free.has(s.id)).map(s => s.id));
      if (!$("ov").classList.contains("on")) render();
    }
  } catch(e){}
}

function openModal(id){
  const s = SLOTS.find(x => x.id === id);
  if (!s) return;
  booking = false;
  if (sb && LINK) sb.from("analytics_events").insert({ link_id: LINK.id, type: "slot_click", meta:{ slotId:id } });
  const when = dayLabel(new Date(s.start_utc)) + " · " + timeLabel(new Date(s.start_utc)) + "–" + timeLabel(new Date(s.end_utc));
  $("modal").innerHTML =
    '<h2>Confirm your booking</h2><div class="when">'+when+'</div>'+
    '<label>Your name</label><input id="gName" autocomplete="name">'+
    '<label>Your email</label><input id="gEmail" type="email" autocomplete="email">'+
    '<label style="margin-bottom:2px">Bring your team <span style="color:var(--muted);font-weight:400">(optional)</span></label>'+
    '<div id="guestWrap"></div>'+
    '<button type="button" id="addGuest" style="background:none;border:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:6px 0 0">+ Add a teammate</button>'+
    '<div class="err" id="mErr"></div>'+
    '<button class="btn" id="confirm">Book it</button>'+
    '<button class="btn sec" id="cancel">Cancel</button>';
  $("ov").classList.add("on");
  $("cancel").onclick = closeModal;
  $("confirm").onclick = () => doBook(id);
  $("addGuest").onclick = addGuestRow;
  $("gName").focus();
}
function addGuestRow(){
  const wrap = $("guestWrap");
  if (wrap.querySelectorAll(".gGuest").length >= 10) return;
  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:6px;align-items:center;margin-top:8px";
  row.innerHTML = '<input class="gGuest" type="email" placeholder="teammate@company.com" autocomplete="off" style="flex:1">'+
    '<button type="button" aria-label="Remove" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px">×</button>';
  row.querySelector("button").onclick = () => row.remove();
  wrap.appendChild(row);
  row.querySelector("input").focus();
}
function closeModal(){ $("ov").classList.remove("on"); }

let booking = false;
async function doBook(slotId){
  const name = $("gName").value.trim(), email = $("gEmail").value.trim();
  if (!name || !/.+@.+\..+/.test(email)){ $("mErr").textContent = "Please enter your name and a valid email."; return; }
  if (booking) return; booking = true;
  const guests = [...new Set([...document.querySelectorAll(".gGuest")].map(i => i.value.trim().toLowerCase()).filter(v => /.+@.+\..+/.test(v) && v !== email.toLowerCase()))];
  const btn = $("confirm"); btn.disabled = true; btn.textContent = "Booking…"; $("mErr").textContent = "";
  try {
    const r = await fetch(FN + "/book-slot", {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey": C.SUPABASE_ANON_KEY, "Authorization":"Bearer "+C.SUPABASE_ANON_KEY },
      body: JSON.stringify({ slug, slotId, name, email, guests }),
    });
    const j = await r.json().catch(()=>({}));
    if (r.status === 409 || j.reason === "taken" || j.reason === "no_longer_available"){
      $("mErr").textContent = "Sorry — that time was just taken. Pick another.";
      const s = SLOTS.find(x=>x.id===slotId); if (s) s.status = "booked";
      setTimeout(() => { closeModal(); render(); }, 1400); return;
    }
    if (!r.ok || !j.ok){ $("mErr").textContent = "Something went wrong — please try again."; btn.disabled=false; btn.textContent="Book it"; booking=false; return; }
    const s = SLOTS.find(x=>x.id===slotId); if (s) s.status = "booked";
    const whenStr = s ? "See you " + new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "long" }).format(new Date(s.start_utc)) + " at " + timeLabel(new Date(s.start_utc)) : "";
    confirmView(j.joinUrl, name, whenStr, j.bookingId);
  } catch(e){ $("mErr").textContent = "Network error — please try again."; btn.disabled=false; btn.textContent="Book it"; booking=false; }
}

function confirmView(joinUrl, name, whenStr, bookingId){
  const safeJoin = (joinUrl && /^https?:\/\/[^\s"'<>]+$/i.test(joinUrl)) ? joinUrl : "";
  const first = ((name || "").trim().split(/\s+/)[0] || "").replace(/[<>&"]/g, "");
  $("modal").innerHTML =
    '<div class="ok-hero"><img src="brand/octavia-trophy-confetti.webp" alt="" width="190"></div>'+
    '<h2 style="text-align:center">You’re booked' + (first ? ", " + first : "") + '.</h2>'+
    '<p style="text-align:center;color:var(--muted);margin-top:6px;font-size:13.5px">' + (whenStr ? whenStr + ". " : "") + 'A calendar invite is on its way to your inbox.</p>'+
    (safeJoin ? '<div style="text-align:center"><a class="joinbtn" href="'+safeJoin+'" target="_blank" rel="noopener">Join link</a></div>' : '')+
    '<button class="btn sec" id="done" style="margin-top:18px">Done</button>';
  $("done").onclick = () => { closeModal(); render(); };
  if (window.confetti) { try { window.confetti({ particleCount: 130, spread: 78, origin: { y: 0.6 }, colors: ['#5E43C8','#098768','#C5BDFB','#FFCE00'] }); } catch(e){} }
}

function greeting(){ const h = new Date().getHours(); return h < 12 ? "Good morning! ☀️" : h < 18 ? "Good afternoon! 👋" : "Good evening! 🌙"; }

function renderCancel(id){
  $("title").textContent = "Cancel booking";
  $("sub").textContent = "";
  const tz = document.querySelector(".tzrow"); if (tz) tz.style.display = "none";
  if (!FN || !C.SUPABASE_ANON_KEY){ fail("Booking isn’t configured."); return; }
  $("list").innerHTML = '<div class="msg" style="text-align:center">'
    + '<p style="font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px">Cancel this meeting?</p>'
    + '<p style="font-size:13px;color:var(--muted);margin-bottom:18px">This frees the time slot and notifies everyone on the invite.</p>'
    + '<button class="btn" id="cxConfirm" style="background:#E5484D;max-width:260px;margin:0 auto">Yes, cancel it</button>'
    + '<div class="err" id="cxErr" style="margin-top:10px"></div></div>';
  $("cxConfirm").onclick = async () => {
    const btn = $("cxConfirm"); btn.disabled = true; btn.textContent = "Cancelling…"; $("cxErr").textContent = "";
    try {
      const r = await fetch(FN + "/cancel-booking", { method: "POST", headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY }, body: JSON.stringify({ bookingId: id }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok){
        $("list").innerHTML = '<div class="msg" style="text-align:center"><div class="ok-ico">✓</div><p style="font-size:16px;color:var(--ink);font-weight:600;margin-top:8px">Your meeting is cancelled.</p><p style="font-size:13px;color:var(--muted);margin-top:4px">The time has been freed up — you can close this page.</p></div>';
      } else if (j.reason === "not_found"){
        $("cxErr").textContent = "Couldn’t find that booking — it may already be cancelled."; btn.disabled = false; btn.textContent = "Yes, cancel it";
      } else {
        $("cxErr").textContent = "Something went wrong — please try again."; btn.disabled = false; btn.textContent = "Yes, cancel it";
      }
    } catch(e){ $("cxErr").textContent = "Network error — please try again."; btn.disabled = false; btn.textContent = "Yes, cancel it"; }
  };
}

async function init(){
  const cancelId = new URLSearchParams(location.search).get("cancel");
  if (cancelId){ renderCancel(cancelId); return; }
  buildTzSel();
  if (!slug){ fail("<b>This link is missing its code.</b><br><span class='ms'>Copy the full link from your email and try again.</span>"); return; }
  if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY){
    fail("Booking isn’t configured yet.<br><span style='font-size:12px'>The host needs to finish backend setup (wecalendar-backend/README.md).</span>"); return;
  }
  sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);

  const { data: link } = await sb.from("links").select("id,title,tz,status").eq("slug", slug).maybeSingle();
  if (!link || link.status !== "active"){ fail("<b>This link has expired.</b><br><span class='ms'>Nothing was booked \u2014 ask your host for a fresh link.</span>"); return; }
  LINK = link;
  $("title").textContent = link.title || "Book a time";
  $("sub").textContent = greeting() + " Pick a time that works for you — it books instantly.";

  const { data: slots } = await sb.from("slots").select("id,start_utc,end_utc,status").eq("link_id", link.id);
  SLOTS = slots || [];
  sb.from("analytics_events").insert({ link_id: link.id, type: "view" });
  render();
  recheck();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) recheck(); });
  setInterval(recheck, 60000);

  // live slot-locking: when any slot flips status, reflect it immediately
  sb.channel("slots-" + link.id)
    .on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "slots", filter: "link_id=eq." + link.id },
      (payload) => {
        const i = SLOTS.findIndex(x => x.id === payload.new.id);
        if (i >= 0) SLOTS[i] = payload.new; else SLOTS.push(payload.new);
        if (!$("ov").classList.contains("on")) render();
      })
    .subscribe();
}
$("ov").addEventListener("click", (e)=>{ if (e.target.id === "ov") closeModal(); });
init();
</script>
