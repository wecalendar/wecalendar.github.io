<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your onboarding playbook — WeTransact</title>
<style>
@font-face{font-family:'Greycliff CF';src:url(GreycliffCF-Medium.ttf) format('truetype');font-weight:500}
@font-face{font-family:'Greycliff CF';src:url(GreycliffCF-Bold.ttf) format('truetype');font-weight:700}
*{box-sizing:border-box}
body{margin:0;font-family:'Greycliff CF',-apple-system,'Segoe UI',sans-serif;font-weight:500;color:#343130;background:#F5F3FF;min-height:100vh}
.band{background:#021774;height:96px;position:relative;overflow:hidden}
.band svg{position:absolute;inset:0;width:100%;height:100%}
.band img{position:relative;height:26px;margin:35px 0 0 32px}
.wrap{max-width:560px;margin:48px auto;padding:0 24px}
.card{background:#fff;border:1px solid #E2DBFF;border-radius:16px;padding:32px}
h1{margin:0 0 6px;font-size:24px;font-weight:700;color:#2C1C6C;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:#656578;font-size:14px;line-height:1.55}
.btn{display:inline-block;background:#5E43C8;color:#fff;font-weight:700;font-size:15px;font-family:inherit;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;text-decoration:none}
.btn[disabled]{opacity:.55;cursor:default}
.msg{margin-top:14px;font-size:13px;color:#656578;min-height:18px}
.msg.err{color:#B3261E}
.msg a{color:#5E43C8}
.foot{margin-top:26px;font-size:12px;color:#9191A4}
</style>
</head>
<body>
<div class="band">
  <svg viewBox="0 0 794 96" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="794" height="96" fill="#021774"/><circle cx="600" cy="96" r="118" fill="#8266F4"/><circle cx="600" cy="96" r="53" fill="#FFE163"/></svg>
  <img src="wt-logo-white.png" alt="WeTransact" onerror="this.style.display='none'">
</div>
<div class="wrap"><div class="card">
  <h1 id="hd">Your onboarding playbook</h1>
  <p class="sub">The WeTransact onboarding playbook, personalised for your company — the same copy your CSM sent, ready to forward to your team.</p>
  <button class="btn" id="dl" disabled>Preparing your PDF…</button>
  <div class="msg" id="msg"></div>
  <div class="foot">Questions? Reply to the email this came from and your CSM will pick it up.</div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var company = (q.get("c") || "").trim().slice(0, 80);
  var portal  = (q.get("p") || "").trim();
  var booking = (q.get("b") || "").trim();
  var csm     = (q.get("n") || "").trim().slice(0, 60);
  var PDF_URL = "playbook-template.pdf";
  var SELF_PDF = "https://wecalendar.github.io/WeTransact-Onboarding-Playbook.pdf";
  var GA_PDF = "https://wecalendar.github.io/Forward-to-Global-Admin.pdf";
  var dl = document.getElementById("dl"), msg = document.getElementById("msg");

  if (!/^https?:\/\/[^\s]+$/i.test(portal)) portal = "";
  if (!/^https?:\/\/[^\s]+$/i.test(booking)) booking = "";
  if (!company){ location.replace(SELF_PDF); return; }

  document.getElementById("hd").textContent = "Onboarding playbook — " + company;
  var safe = company.replace(/[^A-Za-z0-9 _-]/g, "").trim().replace(/\s+/g, "-").slice(0, 40) || "WeTransact";
  var FILE = "WeTransact-Onboarding-Playbook-" + safe + ".pdf";

  var selfUrl = "https://wecalendar.github.io/pb.html?c=" + encodeURIComponent(company)
    + (portal ? "&p=" + encodeURIComponent(portal) : "")
    + (booking ? "&b=" + encodeURIComponent(booking) : "")
    + (csm ? "&n=" + encodeURIComponent(csm) : "");
  var gaUrl = "https://wecalendar.github.io/ga.html?p=" + encodeURIComponent(portal) + "&c=" + encodeURIComponent(company);

  function fetchBuf(u){ return fetch(u).then(function(r){ if (!r.ok) throw new Error("download failed (" + r.status + ")"); return r.arrayBuffer(); }); }

  function setLink(PL, doc, from, to){
    var changed = [];
    doc.getPages().forEach(function(p){
      var an = p.node.Annots ? p.node.Annots() : null; if (!an) return;
      for (var i = 0; i < an.size(); i++){
        try {
          var a = an.lookup(i, PL.PDFDict);
          var act = a && a.lookup(PL.PDFName.of("A"), PL.PDFDict); if (!act) continue;
          var u = act.lookup(PL.PDFName.of("URI"));
          if (u && u.decodeText && u.decodeText() === from){ act.set(PL.PDFName.of("URI"), PL.PDFString.of(to)); changed.push(a); }
        } catch(e){}
      }
    });
    return changed;
  }

  var built = null;
  function build(){
    if (built) return built;
    built = Promise.all([fetchBuf(PDF_URL), fetchBuf("GreycliffCF-Bold.ttf"), fetchBuf("GreycliffCF-Medium.ttf")]).then(function(a){
      var PL = window.PDFLib;
      return PL.PDFDocument.load(a[0]).then(function(doc){
        doc.registerFontkit(window.fontkit);
        return Promise.all([doc.embedFont(a[1], { subset: true }), doc.embedFont(a[2], { subset: true })]).then(function(f){
          var bold = f[0], med = f[1], p1 = doc.getPage(0);
          var purple = PL.rgb(0.369, 0.263, 0.784), muted = PL.rgb(0.396, 0.396, 0.471);
          /* same stamps as the add-in */
          var t = "Prepared for " + company, size = 13;
          while (bold.widthOfTextAtSize(t, size) > 380 && size > 8) size -= 0.5;
          p1.drawText(t, { x: 40, y: 692, size: size, font: bold, color: purple });
          var foot = csm ? (" · Your CSM: " + csm) : "";
          if (booking) foot += " · Book time: " + booking;
          if (foot){ var fsz = 8; while (med.widthOfTextAtSize(foot, fsz) > 392 && fsz > 5.5) fsz -= 0.25; p1.drawText(foot, { x: 87, y: 23.5, size: fsz, font: med, color: muted }); }
          /* share pill → this page again, with the same params */
          var share = setLink(PL, doc, SELF_PDF, selfUrl);
          if (share.length){
            p1.drawRectangle({ x: 157.5, y: 467.5, width: 303, height: 14, color: PL.rgb(1, 1, 1) });
            var pt = "your personalised copy »", ps = 10, pw = bold.widthOfTextAtSize(pt, ps);
            p1.drawText(pt, { x: 160, y: 471.4, size: ps, font: bold, color: purple });
            p1.drawRectangle({ x: 160, y: 469.6, width: pw, height: 0.7, color: purple });
            try { share[0].set(PL.PDFName.of("Rect"), doc.context.obj([160, 469.4, 160 + pw, 481])); } catch(e){}
          }
          /* Global Admin guide → personalised download page */
          if (portal) setLink(PL, doc, GA_PDF, gaUrl);
          return doc.save();
        });
      });
    });
    return built;
  }

  function download(){
    dl.disabled = true; dl.textContent = "Preparing your PDF…"; msg.className = "msg"; msg.textContent = "";
    build().then(function(bytes){
      var blob = new Blob([bytes], { type: "application/pdf" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = FILE;
      document.body.appendChild(a); a.click(); a.remove();
      dl.disabled = false; dl.textContent = "Download the playbook again";
      msg.textContent = "✓ " + FILE + " downloaded.";
    }).catch(function(e){
      built = null; dl.disabled = false; dl.textContent = "Try again";
      msg.className = "msg err";
      msg.innerHTML = "Couldn't personalise the PDF (" + String((e && e.message) || e).replace(/[<>&]/g, "") + ") — <a href=\"" + SELF_PDF + "\">download the standard playbook</a> instead.";
    });
  }

  dl.addEventListener("click", download);
  download();
})();
</script>
</body>
</html>
