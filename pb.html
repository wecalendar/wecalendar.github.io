<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Downloading your playbook…</title>
<style>
body{margin:0;font-family:-apple-system,'Segoe UI',sans-serif;background:#fff;color:#656578;
  min-height:100vh;display:flex;align-items:center;justify-content:center}
.m{font-size:14px;text-align:center;padding:24px;line-height:1.6}
.m a{color:#5E43C8;font-weight:600}
</style>
</head>
<body>
<div class="m" id="m">Preparing your download…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var company = (q.get("c") || "").trim().slice(0, 80);
  var portal  = (q.get("p") || "").trim();
  var booking = (q.get("b") || "").trim();
  var csm     = (q.get("n") || "").trim().slice(0, 60);
  var PDF_URL = "playbook-template.pdf";
  var SELF_PDF = "https://wecalendar.github.io/WeTransact-Onboarding-Playbook.pdf";
  var GA_PDF = "https://wecalendar.github.io/Forward-to-Global-Admin.pdf";
  var m = document.getElementById("m");

  if (!/^https?:\/\/[^\s]+$/i.test(portal)) portal = "";
  if (!/^https?:\/\/[^\s]+$/i.test(booking)) booking = "";
  if (!company){ location.replace(SELF_PDF); return; }

  var safe = company.replace(/[^A-Za-z0-9 _-]/g, "").trim().replace(/\s+/g, "-").slice(0, 40) || "WeTransact";
  var FILE = "WeTransact-Onboarding-Playbook-" + safe + ".pdf";

  var selfUrl = "https://wecalendar.github.io/pb.html?c=" + encodeURIComponent(company)
    + (portal ? "&p=" + encodeURIComponent(portal) : "")
    + (booking ? "&b=" + encodeURIComponent(booking) : "")
    + (csm ? "&n=" + encodeURIComponent(csm) : "");
  var gaUrl = "https://wecalendar.github.io/ga.html?p=" + encodeURIComponent(portal) + "&c=" + encodeURIComponent(company);

  function fetchBuf(u){ return fetch(u).then(function(r){ if (!r.ok) throw new Error("download failed (" + r.status + ")"); return r.arrayBuffer(); }); }

  function setLink(PL, doc, from, to){
    var changed = [];
    doc.getPages().forEach(function(p){
      var an = p.node.Annots ? p.node.Annots() : null; if (!an) return;
      for (var i = 0; i < an.size(); i++){
        try {
          var a = an.lookup(i, PL.PDFDict);
          var act = a && a.lookup(PL.PDFName.of("A"), PL.PDFDict); if (!act) continue;
          var u = act.lookup(PL.PDFName.of("URI"));
          if (u && u.decodeText && u.decodeText() === from){ act.set(PL.PDFName.of("URI"), PL.PDFString.of(to)); changed.push(a); }
        } catch(e){}
      }
    });
    return changed;
  }

  var built = null;
  function build(){
    if (built) return built;
    built = Promise.all([fetchBuf(PDF_URL), fetchBuf("GreycliffCF-Bold.ttf"), fetchBuf("GreycliffCF-Medium.ttf")]).then(function(a){
      var PL = window.PDFLib;
      return PL.PDFDocument.load(a[0]).then(function(doc){
        doc.registerFontkit(window.fontkit);
        return Promise.all([doc.embedFont(a[1], { subset: true }), doc.embedFont(a[2], { subset: true })]).then(function(f){
          var bold = f[0], med = f[1], p1 = doc.getPage(0);
          var purple = PL.rgb(0.369, 0.263, 0.784), muted = PL.rgb(0.396, 0.396, 0.471);
          var t = "Prepared for " + company, size = 13;
          while (bold.widthOfTextAtSize(t, size) > 380 && size > 8) size -= 0.5;
          p1.drawText(t, { x: 40, y: 692, size: size, font: bold, color: purple });
          var foot = csm ? (" · Your CSM: " + csm) : "";
          if (booking) foot += " · Book time: " + booking;
          if (foot){ var fsz = 8; while (med.widthOfTextAtSize(foot, fsz) > 392 && fsz > 5.5) fsz -= 0.25; p1.drawText(foot, { x: 87, y: 23.5, size: fsz, font: med, color: muted }); }
          var share = setLink(PL, doc, SELF_PDF, selfUrl);
          if (share.length){
            p1.drawRectangle({ x: 157.5, y: 467.5, width: 303, height: 14, color: PL.rgb(1, 1, 1) });
            var pt = "your personalised copy »", ps = 10, pw = bold.widthOfTextAtSize(pt, ps);
            p1.drawText(pt, { x: 160, y: 471.4, size: ps, font: bold, color: purple });
            p1.drawRectangle({ x: 160, y: 469.6, width: pw, height: 0.7, color: purple });
            try { share[0].set(PL.PDFName.of("Rect"), doc.context.obj([160, 469.4, 160 + pw, 481])); } catch(e){}
          }
          if (portal) setLink(PL, doc, GA_PDF, gaUrl);
          return doc.save();
        });
      });
    });
    return built;
  }

  function download(){
    build().then(function(bytes){
      var blob = new Blob([bytes], { type: "application/pdf" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = FILE;
      document.body.appendChild(a); a.click(); a.remove();
      m.innerHTML = "✓ " + FILE + " downloaded — you can close this tab.<br><a href=\"#\" id=\"re\">Download again</a>";
      document.getElementById("re").onclick = function(e){ e.preventDefault(); download(); };
      setTimeout(function(){ try { window.close(); } catch(e){} }, 1500);
    }).catch(function(e){
      built = null;
      m.innerHTML = "Couldn't personalise the PDF (" + String((e && e.message) || e).replace(/[<>&]/g, "") + ").<br><a href=\"" + SELF_PDF + "\">Download the standard playbook</a> · <a href=\"#\" id=\"re\">try again</a>";
      var re = document.getElementById("re"); if (re) re.onclick = function(ev){ ev.preventDefault(); m.textContent = "Preparing your download…"; download(); };
    });
  }
  download();
})();
</script>
</body>
</html>
