<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeCalendar — Analytics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237A5AEA'/%3E%3Cstop offset='1' stop-color='%23402C93'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='128' height='128' rx='28' fill='url%28%23g%29'/%3E%3Crect x='26' y='32' width='76' height='66' rx='12' fill='%23fff'/%3E%3Crect x='26' y='32' width='76' height='16' rx='8' fill='%23EBE7FF'/%3E%3Crect x='26' y='40' width='76' height='8' fill='%23EBE7FF'/%3E%3Crect x='42' y='24' width='7' height='16' rx='3.5' fill='%23021774'/%3E%3Crect x='79' y='24' width='7' height='16' rx='3.5' fill='%23021774'/%3E%3Ccircle cx='43' cy='62' r='5' fill='%23C5BDFB'/%3E%3Ccircle cx='64' cy='62' r='5' fill='%23C5BDFB'/%3E%3Crect x='76' y='54' width='16' height='16' rx='4.5' fill='%2310D0A0'/%3E%3Ccircle cx='43' cy='82' r='5' fill='%23C5BDFB'/%3E%3Ccircle cx='64' cy='82' r='5' fill='%23C5BDFB'/%3E%3Ccircle cx='84' cy='82' r='5' fill='%23C5BDFB'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="wecal-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<link rel="stylesheet" href="wt-brand.css">
<style>
  :root{ --accent:#5E43C8; --ink:#021774; --muted:#4E5D9E; --line:#E1E4FF; --green:#098768; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#F3F5FF; color:var(--ink); padding:28px 18px; }
  .wrap{ max-width:920px; margin:0 auto; }
  .top{ display:flex; align-items:baseline; gap:12px; margin-bottom:6px; }
  .wordmark{ font-size:15px; font-weight:600; } .wordmark .a1{ color:var(--accent); } .wordmark .a2{ color:var(--ink); }
  h1{ font-size:24px; font-weight:600; margin:14px 0 2px; }
  .sub{ color:var(--muted); font-size:13.5px; margin-bottom:20px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card .n{ font-size:30px; font-weight:700; line-height:1.1; }
  .card .l{ font-size:12.5px; color:var(--muted); margin-top:4px; font-weight:500; }
  .card.hl .n{ color:var(--accent); }
  .panel{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  .panel h2{ font-size:15px; font-weight:600; margin-bottom:14px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:left; padding:9px 8px; border-bottom:1px solid #EBE7FF; }
  th{ color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.num,th.num{ text-align:right; }
  .msg{ color:var(--muted); padding:40px; text-align:center; }
  .reload{ margin-left:auto; border:1px solid var(--line); background:#fff; border-radius:9px; padding:6px 12px; font-family:inherit; font-size:13px; cursor:pointer; color:var(--ink); }
  .reload:hover{ background:#EBE7FF; }

  /* ==== WeTransact rebrand (2026-10-31) ==== */
  body{ font-family:var(--wt-font-body); background:linear-gradient(180deg,#EBE7FF 0,#F3F5FF 340px) fixed,#F3F5FF; -webkit-font-smoothing:antialiased; }
  .wordmark, h1, .panel h2, .card .n{ font-family:var(--wt-font-display); }
  .wordmark{ font-size:18px; font-weight:700; letter-spacing:-.02em; } .wordmark .a1{ color:#8266F4; }
  h1{ font-size:40px; font-weight:500; letter-spacing:-.03em; line-height:1.15; }
  .card, .panel{ border-radius:20px; box-shadow:0 18px 40px rgba(31,23,89,.06); }
  .card .n{ font-size:34px; letter-spacing:-.06em; }
  .card.hl{ background:linear-gradient(180deg,#010D40,#402C93); border-color:transparent; }
  .card.hl .n{ color:#fff; } .card.hl .l{ color:#C5BDFB; }
  .panel h2{ font-size:18px; letter-spacing:-.02em; }
  th{ text-transform:none; letter-spacing:0; font-size:12.5px; }
  .reload{ border-color:#D9DDE8; color:#0B1336; border-radius:12px; padding:8px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="brand/logo-colour.svg" alt="WeTransact" style="height:22px;align-self:center"><span class="wordmark"><span class="a1">we</span><span class="a2">calendar</span></span>
    <button class="reload" onclick="load()">↻ Refresh</button>
  </div>
  <h1>Booking analytics</h1>
  <div class="sub" id="sub">Loading…</div>
  <div id="content" style="display:none">
    <div class="cards" id="cards"></div>
    <div class="panel"><h2>Views vs. bookings by link</h2><canvas id="chart" height="120"></canvas></div>
    <div class="panel"><h2>Links</h2><div id="tableWrap"></div></div>
  </div>
  <div class="msg" id="msg" style="display:none"></div>
</div>
<script>
const C = window.WECAL || {};
let chart = null;
const AUTH = { clientId: "d64e24c4-3c00-4b04-9ab0-e337d5fcc34b", tenantId: "wetransact.io" };
const pca = new msal.PublicClientApplication({ auth: { clientId: AUTH.clientId, authority: "https://login.microsoftonline.com/" + AUTH.tenantId, redirectUri: window.location.origin + window.location.pathname }, cache: { cacheLocation: "localStorage" } });
const fmt = (n) => (n ?? 0).toLocaleString();

function card(n, label, hl){ return '<div class="card'+(hl?' hl':'')+'"><div class="n">'+n+'</div><div class="l">'+label+'</div></div>'; }

async function load(){
  document.getElementById("sub").textContent = "Loading…";
  if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY){
    document.getElementById("msg").style.display = "block";
    document.getElementById("msg").textContent = "Backend not configured (wecal-config.js).";
    return;
  }
  try {
    const r = await fetch(C.SUPABASE_URL + "/rest/v1/rpc/get_stats", {
      method: "POST",
      headers: { apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: "{}",
    });
    const s = await r.json();
    render(s);
  } catch (e) {
    document.getElementById("msg").style.display = "block";
    document.getElementById("msg").textContent = "Couldn't load analytics: " + e.message;
  }
}

function render(s){
  document.getElementById("content").style.display = "";
  document.getElementById("msg").style.display = "none";
  document.getElementById("sub").textContent = "Across " + fmt(s.links) + " booking link" + (s.links === 1 ? "" : "s") + " · updates live each time you open this page.";
  document.getElementById("cards").innerHTML =
    card(fmt(s.views), "Link views") +
    card(fmt(s.slot_clicks), "Slot clicks") +
    card(fmt(s.bookings), "Bookings", true) +
    card((s.booking_rate ?? 0) + "%", "Booking rate", true) +
    card(s.avg_time_to_book_min != null ? Math.round(s.avg_time_to_book_min) + "m" : "—", "Avg time to book") +
    card(fmt(s.no_shows), "No‑shows");

  const links = s.by_link || [];
  const labels = links.map(l => (l.title || l.slug || "—").slice(0, 22));
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: { labels, datasets: [
      { label: "Views", data: links.map(l => l.views), backgroundColor: "#C5BDFB" },
      { label: "Bookings", data: links.map(l => l.bookings), backgroundColor: "#5E43C8" },
    ]},
    options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }, plugins: { legend: { position: "bottom" } } },
  });

  let rows = links.map(l => "<tr><td>" + (l.title || "(untitled)") + "</td><td class='num'>" + fmt(l.views) + "</td><td class='num'>" + fmt(l.bookings) + "</td><td>" + new Date(l.created_at).toLocaleDateString() + "</td></tr>").join("");
  if (!rows) rows = "<tr><td colspan='4' style='color:var(--muted)'>No links yet — create one in WeCalendar.</td></tr>";
  document.getElementById("tableWrap").innerHTML =
    "<table><thead><tr><th>Link</th><th class='num'>Views</th><th class='num'>Bookings</th><th>Created</th></tr></thead><tbody>" + rows + "</tbody></table>";
}
async function gate(){
  try { await pca.initialize(); const resp = await pca.handleRedirectPromise(); if (resp && resp.account) pca.setActiveAccount(resp.account); } catch(e){}
  const acct = pca.getActiveAccount() || (pca.getAllAccounts()[0] || null);
  const email = ((acct && acct.username) || "").toLowerCase();
  if (acct && ["wetransact.io", "awssome.io"].some(d => email.endsWith("@" + d))){ load(); return; }
  document.getElementById("content").style.display = "none";
  document.getElementById("sub").textContent = "Sign-in required";
  const m = document.getElementById("msg"); m.style.display = "block"; m.textContent = "";
  const p = document.createElement("p");
  p.textContent = acct ? "This dashboard is limited to company accounts (wetransact.io / awssome.io)." : "Sign in to WeCalendar to view analytics.";
  m.appendChild(p);
  if (!acct){
    const open = document.createElement("button"); open.className = "reload"; open.style.marginTop = "12px"; open.textContent = "Open WeCalendar to sign in";
    open.onclick = () => window.open(window.location.origin + "/", "_blank");
    const retry = document.createElement("button"); retry.className = "reload"; retry.style.cssText = "margin-top:12px;margin-left:8px"; retry.textContent = "I've signed in — retry";
    retry.onclick = () => { m.style.display = "none"; gate(); };
    m.appendChild(open); m.appendChild(retry);
  }
}
gate();
</script>
</body>
</html>
